name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (Build & package assets without publishing GitHub Release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Linux Targets using Docker
        run: |
          mkdir -p dist
          make dist/twSdrPower dist/twSdrPower.arm dist/twSdrPower.arm64

      - name: Package Linux Assets
        run: |
          cd dist
          zip twSdrPower_linux.zip twSdrPower twSdrPower.arm twSdrPower.arm64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twSdrPower_linux
          path: dist/twSdrPower_linux.zip

  build-mac:
    name: Build macOS Binary
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Dependencies
        run: |
          brew update
          brew install libusb librtlsdr pkg-config || brew install libusb rtl-sdr pkg-config

      - name: Build macOS Target
        run: |
          mkdir -p dist
          export CGO_ENABLED=1
          
          RTLSDR_PREFIX=$(brew --prefix librtlsdr 2>/dev/null || brew --prefix rtl-sdr 2>/dev/null || echo "/opt/homebrew")
          LIBUSB_PREFIX=$(brew --prefix libusb 2>/dev/null || echo "/opt/homebrew")
          
          export CGO_CFLAGS="-I${RTLSDR_PREFIX}/include -I${LIBUSB_PREFIX}/include"
          export CGO_LDFLAGS="-L${RTLSDR_PREFIX}/lib -L${LIBUSB_PREFIX}/lib -lusb-1.0 -lrtlsdr"
          
          make mac

      - name: Package macOS Asset
        run: |
          cd dist
          zip twSdrPower_mac.zip twSdrPower.darwin

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twSdrPower_mac
          path: dist/twSdrPower_mac.zip

  release:
    name: Create GitHub Release
    needs: [build-linux, build-mac]
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run }}
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: twSdrPower_linux
          path: dist

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: twSdrPower_mac
          path: dist

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/twSdrPower_linux.zip
            dist/twSdrPower_mac.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
